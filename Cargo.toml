[package]
name = "webview-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A WebView engine Dota 2 Mod Manager puts in itself when the system one is missing or broken"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "webview-runtime"
path = "src/bin/webview-runtime.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tar = "0.4"

# Windows: the system's certificate store. Linux: Mozilla's roots built in, so the static launcher
# (x86_64-unknown-linux-musl) needs neither OpenSSL nor the host's certificate files, which
# Alpine and NixOS keep in places of their own.
[target.'cfg(windows)'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
